    <link rel="apple-touch-icon" href="./me.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- SEO -->
    <link rel="icon" href="./me.jpeg" type="image/jpeg">
    <link rel="canonical" href="https://shantirammeche2219bit-netizen.github.io/shantiram_meche/">
    <meta name="description" content="Shantiram Meche - CEO & Founder of Frame Syndicate.">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header>
    <nav>
        <a href="#" class="logo">Shantiram <span class="logo-yellow">Meche</span></a>
        <ul class="nav-links">
            <li><a href="#services" class="nav-link">Services</a></li>
            <li><a href="./portfolio.html" class="nav-link">Portfolio</a></li>
            <li><a href="./about.html" class="nav-link">About</a></li>
            <li><a href="#contact" class="nav-link">Contact</a></li>
        </ul>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>
</header>

<section class="hero">
    <div class="hero-container">
        <div class="hero-content">
            <h1>Hi, I'm <span class="highlight">Shantiram Meche</span></h1>
            <p class="hero-subtitle">CEO & Founder of Frame Syndicate</p>
            <p class="hero-description">
                Visionary entrepreneur helping enterprises transform through innovative IT solutions.
            </p>

            <div class="cta-buttons">
                <a href="#contact" class="btn btn-primary">Get In Touch</a>
                <a href="./portfolio.html" class="btn btn-secondary">View Work</a>
            </div>

            <!-- 🔥 INSTALL BUTTON -->
            <button id="installBtn" style="margin-top:20px; display:none; padding:10px 20px; cursor:pointer;">
                Install App
            </button>
        </div>

        <div class="hero-image-box">
            <div class="image-frame">
                <img src="./me.jpeg" alt="Shantiram Meche">
            </div>
        </div>
    </div>
</section>

<section class="services" id="services">
    <h2 style="text-align:center;">Services</h2>
</section>

<section class="contact" id="contact">
    <h2 style="text-align:center;">Contact</h2>
</section>

<footer>
    <p>&copy; 2026 Shantiram Meche</p>
</footer>

<script>
// Mobile menu
const hamburger = document.querySelector('.hamburger');
const navLinks = document.querySelector('.nav-links');

if (hamburger) {
    hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        navLinks.classList.toggle('active');
    });
}

// ✅ SERVICE WORKER
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => console.log("✅ Service Worker Registered"))
            .catch(err => console.log("❌ SW Failed", err));
    });
}

// 🔥 INSTALL BUTTON LOGIC
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
});

installBtn.addEventListener("click", () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
    }
});

// iOS fallback
const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

if (isIOS && !isStandalone) {
    alert("To install: Tap Share → Add to Home Screen");
}
</script>

</body>
